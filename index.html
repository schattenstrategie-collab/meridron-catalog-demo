<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Meridron Blueprint Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: product page first (see the module, what it can do, the film), then "Build now" opens one licensed build with a single-use ZIP. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunken:#f4f5f2; --ink:#17202b; --muted:#566270; --line:#d5dbe1;
  --accent:#ff5c10; --accent-ink:#b4400a; --on-accent:#17202b; --accent-soft:#fff0e6;
  --ok:#1d7a4c; --ok-soft:#e6f3eb; --warn:#a15c00; --warn-soft:#fff4dc; --lock:#8a95a1;
  --stage:#121a24; --stage-ink:#eef1f4; --stage-muted:#93a1b0;
  --shadow:0 1px 2px rgba(23,32,43,.06),0 8px 24px rgba(23,32,43,.07);
  --f-display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202b; --sunken:#1d2733; --ink:#edf1f5; --muted:#9eabb8; --line:#2b3745;
  --accent:#ff6a24; --accent-ink:#ff9a66; --on-accent:#121820; --accent-soft:#3a2216;
  --ok:#52c28d; --ok-soft:#173527; --warn:#ffbf5c; --warn-soft:#3a2d12; --lock:#6f7b88;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202b; --sunken:#1d2733; --ink:#edf1f5; --muted:#9eabb8; --line:#2b3745;
  --accent:#ff6a24; --accent-ink:#ff9a66; --on-accent:#121820; --accent-soft:#3a2216;
  --ok:#52c28d; --ok-soft:#173527; --warn:#ffbf5c; --warn-soft:#3a2d12; --lock:#6f7b88;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#121a24}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.02;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.eyebrow{font:600 12.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.big{min-height:64px;font-size:19px;padding:0 26px;border-radius:14px}
.btn.huge{min-height:76px;font:700 30px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding:0 34px;border-radius:16px}
.btn svg{width:22px;height:22px;flex:none}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font:600 13px/1.3 var(--f-mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.pill.rev{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.proto{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:6px;padding:2px 6px}
.note{font-size:14px;color:var(--muted)}

/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.lg-art{background:#121a24;color:#eef1f4;padding:48px var(--gutr) 40px var(--gut);display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.lg-art::after,.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.lg-art > *{position:relative;z-index:1}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:700 26px/1 var(--f-display);letter-spacing:.06em}
.brand span{font:600 12px/1 var(--f-mono);letter-spacing:.12em;color:#93a1b0;text-transform:uppercase}
.lg-art h1{font-size:clamp(40px,6vw,74px);color:#fff;max-width:12ch}
.lg-art h1 em{font-style:normal;color:#ff6a24}
.lg-art img{width:100%;max-width:680px;align-self:center;filter:drop-shadow(0 20px 30px rgba(0,0,0,.45))}
.lg-steps{display:flex;gap:18px;flex-wrap:wrap;font:600 14px/1 var(--f-mono);color:#b9c4cf;text-transform:uppercase;letter-spacing:.08em}
.lg-steps i{font-style:normal;color:#ff6a24;margin-right:6px}
.lg-form{display:flex;align-items:center;justify-content:center;padding:40px var(--gutr) 40px var(--gut);background:var(--bg)}
.lg-card{width:100%;max-width:420px;display:grid;gap:18px}
.lg-card h2{font-size:38px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:400 18px var(--f-mono)}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#121a24;color:#eef1f4}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.bar .brand{margin-right:auto;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.bar nav{display:flex;gap:4px}
.bar nav button{background:none;border:0;color:#b9c4cf;font:700 15px/1 var(--f-body);padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.bar nav button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08)}
.bar nav .cnt{font:700 12px/1 var(--f-mono);background:#ff6a24;color:#121820;border-radius:999px;padding:3px 7px}
.bar .out{background:none;border:1px solid #33414f;color:#b9c4cf;border-radius:10px;padding:8px 12px;cursor:pointer;font:600 13px var(--f-mono)}
main{padding-block:0 80px}
.view{display:grid;gap:34px}

/* product hero */
.hero2{background:#121a24;color:var(--stage-ink)}
.hero2 .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:26px 34px}
.stage{position:relative;aspect-ratio:16/11;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1d2a38 0%,#121a24 70%);border:1px solid #233140;max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;display:block}
.stage canvas:active{cursor:grabbing}
.stage .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage-ui{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.stage-ui > *{pointer-events:auto}
.seg{display:inline-flex;background:rgba(18,26,36,.85);border:1px solid #33414f;border-radius:12px;padding:4px;gap:4px;backdrop-filter:blur(4px)}
.seg button{border:0;background:none;color:#b9c4cf;font:700 15px var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#ff6a24;color:#121820}
.hint{font:600 12.5px var(--f-mono);color:#93a1b0;background:rgba(18,26,36,.7);padding:6px 10px;border-radius:8px}
.legend{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;font:600 12.5px var(--f-mono);color:#cfd7df}
.legend span{display:flex;align-items:center;gap:6px;background:rgba(18,26,36,.75);padding:5px 9px;border-radius:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pinfo{display:grid;gap:16px;align-content:center}
.pinfo .eyebrow{color:#93a1b0}
.pinfo h1{font-size:clamp(52px,7vw,92px);color:#fff}
.pinfo .lede{font-size:19px;color:#cfd7df;max-width:42ch}
.pinfo .pill{background:transparent;color:#eef1f4;border-color:#3a4857}
.pinfo .pill.rev{background:#eef1f4;color:#121a24;border-color:#eef1f4}
.counter{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid #2c3a49;border-radius:14px;padding:12px 16px}
.counter b{font:700 44px/1 var(--f-display);color:#ff6a24;font-variant-numeric:tabular-nums}
.counter span{font-size:14.5px;color:#cfd7df;line-height:1.35}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cta .btn.ghost2{background:transparent;color:#eef1f4;border-color:#3a4857}

/* sections */
.sec-h{display:grid;gap:8px}
.sec-h h2{font-size:clamp(32px,4.4vw,46px);text-transform:uppercase}
.sec-h p{color:var(--muted);max-width:62ch}
.caps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.cap svg{width:34px;height:34px;color:var(--accent-ink)}
.cap b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cap strong{font:700 17px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.cap p{font-size:15px;color:var(--muted);line-height:1.4}
.film{background:#121a24;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
video{width:100%;max-width:100%;display:block;background:#121a24;aspect-ratio:16/9}
.film .cap2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;color:#b9c4cf;font:600 14px var(--f-mono)}
.folders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start;min-width:0}
.fold .n{font:700 30px/1 var(--f-display);color:var(--accent-ink)}
.fold h3{font-size:20px;text-transform:uppercase}
.fold p{font-size:14.5px;color:var(--muted);line-height:1.4}
.fold .for{font:600 12.5px var(--f-mono);color:var(--ink);background:var(--sunken);border-radius:6px;padding:3px 7px;justify-self:start}
.buildbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:22px}
.buildbox h3{font-size:32px;text-transform:uppercase}
.buildbox p{color:var(--muted)}
.rule{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.rule span{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.rule span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent)}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
summary{cursor:pointer;padding:16px 18px;font:700 20px var(--f-display);text-transform:uppercase;letter-spacing:.02em;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:700 24px/1 var(--f-display);color:var(--accent)}
details[open] summary::after{content:"–"}
.tbl{overflow-x:auto;padding:0 18px 18px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.honest{border-left:4px solid var(--warn);background:var(--warn-soft);padding:14px 16px;border-radius:0 12px 12px 0;font-size:15.5px}

/* build view */
.bhead{background:#121a24;color:#eef1f4}
.bhead .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding-block:26px 28px}
.bhead .num{font:700 clamp(64px,10vw,120px)/.85 var(--f-display);color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bhead .num em{font-style:normal;color:#ff6a24}
.bhead .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font:600 14px var(--f-mono);color:#b9c4cf;margin-top:12px}
.bhead .meta b{color:#fff}
.bhead .back{background:none;border:0;color:#93a1b0;font:600 14px var(--f-mono);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font:700 15px var(--f-body);white-space:nowrap}
.status.st-ready{background:#ff6a24;color:#121820}
.status.st-used{background:#2a3644;color:#dfe5eb}
.station{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px clamp(16px,3vw,30px) 30px;display:grid;gap:20px;scroll-margin-top:90px}
.st-head{display:flex;align-items:flex-start;gap:16px}
.st-head .n{font:700 64px/.8 var(--f-display);color:var(--accent)}
.st-head h2{font-size:clamp(30px,4vw,42px);text-transform:uppercase}
.st-head p{color:var(--muted);margin-top:6px;max-width:62ch}
.zipcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;border-radius:16px;padding:20px;border:2px solid var(--accent);background:var(--accent-soft)}
.zipcard .ic{width:64px;height:64px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.zipcard .ic svg{width:34px;height:34px}
.zipcard h3{font-size:28px;text-transform:uppercase}
.zipcard p{color:var(--muted);font-size:15px}
.zipcard .fn{font:600 13px var(--f-mono);color:var(--ink);overflow-wrap:anywhere}
.zipcard.locked{border-color:var(--line);background:var(--sunken)}
.zipcard.locked .ic{background:var(--lock);color:var(--surface)}
.inside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px;margin:0;padding:0;list-style:none}
.inside li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.inside b{font:700 20px var(--f-display);color:var(--accent-ink)}
.inside strong{display:block}
.inside span{font-size:14.5px;color:var(--muted)}
.progress{display:grid;gap:8px}
.bar-track{height:12px;border-radius:999px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--ok);width:0;transition:width .3s}
.progress .lbl{display:flex;justify-content:space-between;font:600 14px var(--f-mono);color:var(--muted)}
.mode{display:flex;gap:6px;flex-wrap:wrap}
.mode button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font:700 15px var(--f-display);cursor:pointer}
.dots button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.step{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);display:grid}
.step .sh{display:flex;gap:14px;align-items:center;padding:16px 18px;background:#121a24;color:#eef1f4}
.step .sh b{font:700 46px/.9 var(--f-display);color:#ff6a24;font-variant-numeric:tabular-nums}
.step .sh h3{font-size:clamp(24px,3vw,32px);text-transform:uppercase;color:#fff}
.step .sh .meta{margin-left:auto;text-align:right;font:600 13px var(--f-mono);color:#b9c4cf;white-space:nowrap}
.step .img{background:#f4f5f2}
.step .img img{display:block;width:100%;height:auto}
.step .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;padding:20px 18px}
.need{display:flex;flex-wrap:wrap;gap:6px}
.need span{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)}
.do{margin:0;padding:0;list-style:none;counter-reset:d;display:grid;gap:12px}
.do li{counter-increment:d;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:17.5px}
.do li::before{content:counter(d);font:700 28px/1 var(--f-display);color:var(--accent)}
.lbl2{font:600 12.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.chk{border-radius:12px;padding:14px 16px;background:var(--ok-soft);border:1.5px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.chk .t{font:700 19px var(--f-display);text-transform:uppercase;color:var(--ok);display:flex;gap:8px;align-items:center}
.mis{border-radius:12px;padding:14px 16px;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.mis .t{font:700 19px var(--f-display);text-transform:uppercase;color:var(--accent-ink)}
.side{display:grid;gap:12px;align-content:start}
.step .foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 18px 18px}
.donebox{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 18px;border-radius:12px;border:2px solid var(--ok);color:var(--ok);font-weight:700;cursor:pointer;background:var(--surface)}
.donebox input{width:24px;height:24px;accent-color:var(--ok)}
.donebox.is{background:var(--ok-soft)}
.nav2{margin-left:auto;display:flex;gap:10px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font-size:15px;padding:8px 4px}
.checks{display:grid;gap:10px}
.cl{display:grid;grid-template-columns:auto minmax(0,190px) minmax(0,1fr);gap:14px;align-items:center;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.cl input{width:26px;height:26px;accent-color:var(--ok)}
.cl b{font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.cl.is{border-color:var(--ok);background:var(--ok-soft)}
.ready{display:none;align-items:center;gap:14px;padding:18px;border-radius:14px;background:var(--ok);color:#fff;font:700 22px var(--f-display);text-transform:uppercase}
.ready.show{display:flex}

/* builds list */
.bigcount{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.bigcount b{font:700 clamp(70px,10vw,120px)/.9 var(--f-display);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.bigcount span{font:700 22px var(--f-display);text-transform:uppercase;color:var(--muted)}
.blist{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.brow .bn{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.brow .bm{font-size:14.5px;color:var(--muted);line-height:1.4;min-width:0}
.brow .bm .mono{color:var(--ink)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.store-note{display:flex;gap:10px;align-items:center;font:600 13px var(--f-mono);color:var(--muted)}
.store-note i{width:9px;height:9px;border-radius:50%;background:var(--lock)}
.store-note.db i{background:var(--ok)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:100%;max-width:560px;background:var(--surface);border-radius:18px;padding:24px;display:grid;gap:14px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{font-size:34px;text-transform:uppercase}
.modal ul{margin:0;padding-left:20px;display:grid;gap:6px}
.modal textarea{width:100%;min-height:120px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;font:inherit}
.modal select{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#121a24;color:#fff;padding:14px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:min(92vw,560px);box-shadow:var(--shadow)}
.faq{display:grid;gap:10px}
.faq details p{padding:0 18px 18px}
.copybox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.copybox span{font:600 16px var(--f-mono);user-select:all}

@media (max-width:980px){
  #login{grid-template-columns:1fr}
  .hero2 .wrap{grid-template-columns:1fr}
  .caps,.folders{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step .cols{grid-template-columns:1fr}
  .bhead .wrap{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .lg-art{padding-block:26px 22px;gap:14px}
  .lg-art img,.lg-steps{display:none}
  .lg-art h1{font-size:36px}
  .lg-form{padding-block:24px 40px}
  .bar .wrap{gap:8px}
  .bar .brand b{font-size:22px}
  .bar .brand span,.bar nav .long{display:none}
  .bar nav{gap:2px}
  .bar nav button{padding:8px 8px;font-size:14.5px}
  .bar .out{display:none}
  .hint{display:none}
  .legend{top:8px;left:8px;gap:5px;font-size:11px}
  .legend span{padding:3px 7px}
  .stage-ui{left:8px;right:8px;bottom:8px}
  .seg button{padding:7px 12px;font-size:14px}
  .stage{aspect-ratio:4/3.4}
  .caps{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cap{padding:14px}
  .cap b{font-size:28px}
  .folders{grid-template-columns:1fr}
  .buildbox{grid-template-columns:1fr}
  .zipcard{grid-template-columns:auto minmax(0,1fr)}
  .zipcard .btn{grid-column:1 / -1}
  .inside{grid-template-columns:1fr}
  .cl{grid-template-columns:auto minmax(0,1fr)}
  .cl span{grid-column:2}
  .brow{grid-template-columns:auto minmax(0,1fr)}
  .brow .status,.brow .btn{grid-column:1 / -1;justify-self:start}
  .step .sh .meta{display:none}
  .nav2{margin-left:0;width:100%}
  .nav2 .btn{flex:1}
  .btn.huge{font-size:26px;min-height:68px;width:100%}
}
@media (max-width:640px){.toast{bottom:auto;top:calc(76px + env(safe-area-inset-top,0px));left:16px;right:16px;transform:none;max-width:none}}
.bhead .status{justify-self:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

    const b = this.get(id); if (!b) return;
    Object.assign(b, fields);
    if (this.mode === "db") {
      const ref = this.db.doc("builds/" + id);
      this.q[id] = (this.q[id] || Promise.resolve()).then(() => ref.update(fields)).catch(() => toast("Could not save this change in the catalog."));
      return this.q[id];
    }
    this.saveLocal();
  },
  async isUsed(id){
    if (this.mode === "db") { try { const s = await this.db.doc("builds/" + id).get(); return s.exists && s.data().status === "used"; } catch(e){ return false; } }
    const b = this.get(id); return !!(b && b.status === "used");
  }
};
const TAB = Math.random().toString(36).slice(2, 10);

/* ================= downloads ================= */
let dlCap = null, dlReady = false;
try { if (window.claude && window.claude.use) window.claude.use("downloads").then(ns => { dlCap = ns; dlReady = true; }, () => { dlReady = true; }); else { dlCap = { save: async ({filename, data}) => { const u = URL.createObjectURL(data); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); } }; dlReady = true; } } catch(e){ dlReady = true; }

async function downloadBuild(id, btn){
  const b = Store.get(id);
  if (!b) return;
  if (await Store.isUsed(id)) { toast("This package was already downloaded. Start a new build to get it again."); render(); return; }
  if (!dlCap) { toast(dlReady ? "Downloads work when this page is opened in Claude (claude.ai or the app)." : "Still loading. Try again in a moment."); return; }
  if (!window.JSZip) { toast("The packer did not load. Reload the page and try again."); return; }
  const label = btn.innerHTML; btn.disabled = true;
  if (Store.mode === "db") {
    try {
      const lease = await Store.db.doc("builds/" + id).acquire({ holder: "tab-" + TAB, ttlMs: 120000 });
      if (!lease.acquired) { btn.disabled = false; toast("This package is being downloaded in another window."); return; }
    } catch(e){}
  }
  const root = "Meridron_D1b_Rev1_Build-" + pad4(b.n) + "/";
  try {
    const zip = new JSZip();
    const man = D.files._manifest;
    let i = 0;
    for (const e of man) {
      const r = await fetch(e.path); if (!r.ok) throw new Error("fetch");
      zip.file(e.zip.replace("Meridron_D1b_Rev1/", root), await r.arrayBuffer(), { compression: e.store ? "STORE" : "DEFLATE" });
      i++; btn.innerHTML = "Loading " + Math.round(100 * i / man.length) + " %";
    }
    zip.file(root + "BUILD_LICENCE.txt",
      "MERIDRON BLUEPRINT CATALOG\n\nBuild " + pad4(b.n) + " · " + drone.name + " " + drone.rev + "\nLicence: " + b.licence +
      "\nWorkshop: " + b.workshop + "\nIssued: " + new Date().toISOString() +
      "\n\nThis package belongs to this one build. It can be downloaded once.\nAnother airframe = a new build in the catalog.\n\nDemo catalog: the lock is enforced by the catalog page, not yet by a licence server.\n");
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
      m => { btn.innerHTML = "Packing " + Math.round(m.percent) + " %"; });
    btn.innerHTML = "Confirm the download";
    await dlCap.save({ filename: "Meridron_D1b_Rev1_Build-" + pad4(b.n) + ".zip", data: blob });
    await Store.patch(id, { status: "used", downloadedAt: new Date().toISOString() });
    toast("Saved. Build " + pad4(b.n) + " is now locked.");
    render();
  } catch (e) {
    const code = e && e.code;
    btn.disabled = false; btn.innerHTML = label;
    if (code === "declined") toast("Download cancelled. The package is still available for this build.");
    else if (code === "rate_limited") toast("One download at a time. Try again in a moment.");
    else if (code === "extension_not_enabled" || code === "rejected_extension") toast("ZIP downloads are switched off in this view. Open the catalog in claude.ai.");
    else toast("This download did not work here. The package is still available for this build.");
  }
}

let tt = null;
function toast(msg){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 4200);
}
function modal(html, bind){
  const s = document.createElement("div"); s.className = "scrim";
  s.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(s);
  const close = () => s.remove();
  s.addEventListener("click", e => { if (e.target === s) close(); });
  s.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  bind && bind(s, close);
  const f = s.querySelector("[data-focus]"); if (f) f.focus();
  return close;
}

      <label class="donebox ${done?"is":""}"><input type="checkbox" data-done="${s.n}" ${done?"checked":""}> Check passed, step done</label>
      <button class="linkbtn" type="button" data-report="${s.n}">Something does not fit? Report it</button>
      ${stepMode==="one"?`<div class="nav2"><button class="btn" type="button" data-prev ${i===0?"disabled":""}>${ICON.arrowL} Back</button><button class="btn primary" type="button" data-next>${i===steps.length-1?"To the checks":"Next step"} ${ICON.arrowR}</button></div>`:""}
    </div></article>`;
}
function stepsHTML(b){ return stepMode === "all" ? steps.map((s,i) => stepHTML(s,i,b)).join("") : stepHTML(steps[cur], cur, b); }
function bindBuild(b0){
  const bid = b0.id, B = () => Store.get(bid) || b0;
  const dl = $("#dl-build"); if (dl) dl.onclick = () => downloadBuild(bid, dl);
  document.querySelectorAll("[data-mode]").forEach(x => x.onclick = () => { stepMode = x.dataset.mode; ls.set("stepMode", stepMode); redrawSteps(B(), true); });
  document.querySelectorAll("[data-chk]").forEach(c => c.onchange = () => {
    const i = +c.dataset.chk;
    const cb = B();
    const arr = c.checked ? Array.from(new Set((cb.checks||[]).concat(i))) : (cb.checks||[]).filter(x => x !== i);
    Store.patch(bid, { checks: arr });
    c.closest(".cl").classList.toggle("is", c.checked);
    $("#ready").classList.toggle("show", arr.length === D.preflight.length);
  });
  document.querySelectorAll("#st-check [data-report]").forEach(x => x.onclick = () => report(bid, +x.dataset.report));
  bindSteps(B());
}
function bindSteps(b0){
  const bid = b0.id, B = () => Store.get(bid) || b0;
  document.querySelectorAll("[data-done]").forEach(c => c.onchange = () => {
    const n = +c.dataset.done;
    const cb = B();
    const arr = c.checked ? Array.from(new Set((cb.done||[]).concat(n))) : (cb.done||[]).filter(x => x !== n);
    Store.patch(bid, { done: arr });
    c.closest(".donebox").classList.toggle("is", c.checked);
    $("#pg-f").style.width = (100*arr.length/steps.length) + "%";
    $("#pg-l").textContent = arr.length + " of " + steps.length + " steps done";
    document.querySelectorAll("#dots button").forEach((d,i) => d.classList.toggle("done", arr.includes(steps[i].n)));
    if (c.checked && stepMode === "one" && cur < steps.length - 1) setTimeout(() => { cur++; redrawSteps(B()); }, 450);
  });
  document.querySelectorAll("#steps [data-report]").forEach(x => x.onclick = () => report(bid, +x.dataset.report));
  const p = $("[data-prev]"), n = $("[data-next]");
  if (p) p.onclick = () => { if (cur > 0){ cur--; redrawSteps(B()); } };
  if (n) n.onclick = () => { if (cur < steps.length - 1){ cur++; redrawSteps(B()); } else { $("#st-check").scrollIntoView({behavior:"smooth"}); } };
  document.querySelectorAll("[data-step]").forEach(x => x.onclick = () => { cur = +x.dataset.step; redrawSteps(B()); });
}
function redrawSteps(b, modeChanged){
  $("#steps").innerHTML = stepsHTML(b);
  const dots = $("#dots"); dots.hidden = stepMode === "all";
  dots.querySelectorAll("button").forEach((x,i) => { x.classList.toggle("cur", i===cur); x.classList.toggle("done", (b.done||[]).includes(steps[i].n)); });
  document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === stepMode)));
  bindSteps(b);
  if (!modeChanged){ const el = $("#step-" + steps[cur].n); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
}

    ${!Store.ready ? `<div class="empty">Loading builds…</div>` : list.length ? `<div class="blist">${list.map(b => `<div class="brow">
        <span class="bn">${pad4(b.n)}</span>
        <div class="bm"><span class="mono">${esc(b.licence)}</span><br>Started ${fmt(b.createdAt)} · ${(b.done||[]).length} of ${steps.length} steps · check ${(b.checks||[]).length} of ${D.preflight.length}</div>

document.addEventListener("click", e => {

        const st = $("#bstatus"); if (st && b.status === "used") { st.className = "status st-used"; st.innerHTML = ICON.lock.replace('<svg','<svg width="18" height="18"') + " Downloaded · locked"; } } }

/* ================= 3D viewer ================= */
let V = null;
function stopViewer(){ if (V) { V.stop(); V = null; } }
async function startViewer(){
  const stage = $("#stage"); if (!stage || !window.THREE) return;
  let model;
  try { model = await (await fetch("media/d1b_model.json")).json(); } catch(e){ return; }
  if (!$("#stage")) return;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch(e){ return; }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const canvas = renderer.domElement; canvas.setAttribute("aria-label", "3D model of the D1b. Drag sideways to turn it.");
  stage.insertBefore(canvas, stage.firstChild);
  $("#fallback").hidden = true;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(26, 1, 10, 20000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4552, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-700, 1600, 900); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(900, 300, -800); scene.add(fill);
  const ORANGE = new THREE.Color(1.0, 0.36, 0.06);
  const parts = [];
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  for (const o of model.objs) {
    const q = new Int16Array(b64(o.p)); const pos = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) pos[i] = q[i] * model.scale;
    const idx = o.i32 ? new Uint32Array(b64(o.i)) : new Uint16Array(b64(o.i));
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setIndex(new THREE.BufferAttribute(idx, 1));
    const base = new THREE.Color(o.c[0], o.c[1], o.c[2]);
    const mat = new THREE.MeshPhongMaterial({ color: base.clone(), flatShading: true, shininess: 10, specular: 0x161616, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(g, mat);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 32), new THREE.LineBasicMaterial({ color: 0x1b2430 }));
    const grp = new THREE.Group(); grp.add(mesh); grp.add(edges); scene.add(grp);
    parts.push({ grp, mat, base, pr: o.pr, off: new THREE.Vector3(o.off[0], o.off[1], o.off[2]) });
  }
  let az = 2.55, el = 0.40, dist = 2650, ex = 0, exT = 0, idleAt = 0, raf = 0, visible = true, last = performance.now();
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix(); dist = 2350 * Math.max(1, 1.45 / cam.aspect); }
  size();
  const ro = new ResizeObserver(size); ro.observe(stage);
  const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && !raf) loop(); }); io.observe(stage);
  let drag = null;
  canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, az, el }; idleAt = performance.now() + 4000; });
  window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp); window.addEventListener("pointercancel", onUp);
  function onMove(e){ if (!drag) return; az = drag.az + (e.clientX - drag.x) * 0.008; el = Math.max(-0.2, Math.min(1.25, drag.el + (e.clientY - drag.y) * 0.004)); idleAt = performance.now() + 4000; }
  function onUp(){ drag = null; }
  document.querySelectorAll("[data-ex]").forEach(btn => btn.onclick = () => {
    exT = +btn.dataset.ex; document.querySelectorAll("[data-ex]").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
    $("#legend").hidden = exT !== 1; $("#hint").textContent = exT ? "36 printed parts · 8 foam parts" : "Drag to turn";
    if (reduce) ex = exT;
  });
  function loop(){
    raf = 0; if (!visible) return;
    const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!drag && now > idleAt && !reduce) az += dt * 0.18;
    ex += (exT - ex) * Math.min(1, dt * 3.2);
    const e = ex * ex * (3 - 2 * ex);
    for (const p of parts) { p.grp.position.copy(p.off).multiplyScalar(e * 1.15); if (p.pr) p.mat.color.copy(p.base).lerp(ORANGE, e); }
    const dd = dist * (1 + 0.16 * e);
    cam.position.set(Math.cos(az) * Math.cos(el) * dd, Math.sin(el) * dd, Math.sin(az) * Math.cos(el) * dd);
    cam.lookAt(0, ex * 10, 0);
    renderer.render(scene, cam);
    raf = requestAnimationFrame(loop);
  }
  loop();
  V = { stop(){ cancelAnimationFrame(raf); raf = 0; visible = false; ro.disconnect(); io.disconnect(); window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onUp); renderer.dispose(); } };
}
